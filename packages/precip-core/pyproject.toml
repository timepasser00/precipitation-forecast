[project]
name = "precip-core"
version = "0.1.0"
description = "Shared code for the precipitation forecast apps: grids, tiles, codec, storage, manifest, registry."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "pillow>=10",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precip_core"]
