[project]
name = "pf-pipeline"
version = "0.1.0"
description = "Fetch ECMWF precipitation forecasts, derive UI-ready data, publish tiles and a manifest."
requires-python = ">=3.12"
dependencies = [
  "precip-core[s3]",
  "numpy>=2",
  "eccodes>=2.38",
  # The eccodes wheel only pulls this in on some resolvers; it carries the binary ecCodes library.
  "eccodeslib>=2.38; platform_system != 'Windows'",
  "ecmwf-opendata>=0.3.20",
]

[project.scripts]
pf-pipeline = "pf_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pf_pipeline"]
