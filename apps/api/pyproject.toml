[project]
name = "pf-api"
version = "0.1.0"
description = "Read-only HTTP API for processed precipitation forecasts."
requires-python = ">=3.12,<3.15"
dependencies = [
  "precip-core[s3]",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pf_api"]
